    .panel h2,.results-panel h2{font-size:16px;margin:0 0 14px}

    .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--mint);box-shadow:0 0 0 3px #61d69b18}
    .account-list{display:grid;gap:7px}
    .account-list.empty{display:block;color:var(--muted)}
    .account-row{display:flex;gap:6px}

    .account.active{background:#254536;border-color:var(--mint);color:#fff}
    .account small{display:block;color:#8d8c82;font-size:10px}
    .icon-btn{width:34px;border:1px solid #45453e;background:#242420;color:#d8d7ce;border-radius:6px;cursor:pointer;font-size:18px}
    .icon-btn:hover{border-color:var(--coral);color:#fff}
    .account-admin{border-top:1px solid #363631;margin-top:12px;padding-top:12px}
    .account-form{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .account-form input,.account-form select,.bulk-form textarea{min-width:0;background:#11110f;border:1px solid #41413b;border-radius:6px;color:var(--text);padding:8px;font:inherit;font-size:12px}
    .account-form .wide{grid-column:1/-1}
    .bulk-form{margin-top:10px}
    .bulk-form textarea{width:100%;min-height:68px;resize:vertical}
    .account-note{color:#8d8c82;font-size:11px;margin:8px 0 0}
    .checks{display:flex;flex-wrap:wrap;gap:8px}
    .checks label{font-size:12px;color:#d0cfc5;background:#121210;border:1px solid #3a3a35;padding:6px 8px;border-radius:6px}
    .checks input{accent-color:var(--coral)}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
    .btn{cursor:pointer;border:0;border-radius:6px;padding:10px 13px;font-weight:800;color:#102219;background:var(--mint)}
    .btn.secondary{background:#30302c;color:#f0efe9}
    .btn.pink{background:var(--coral);color:white}
    .btn.small{padding:7px 10px;font-size:11px}
    .result-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}
    .result-head h2{margin:0}
    .result-head span{color:var(--muted);font-size:12px}
    .verify{margin:-4px 0 13px;color:#8d8c82;font-size:11px;line-height:1.7}
    .verify b{color:var(--mint);font-weight:700}
    .verify.low b{color:var(--yellow)}

    .card{border:1px solid #3b3b36;background:#181816;border-radius:8px;padding:15px}
    .card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .account-name{font-weight:800;font-size:16px}
    .tool{color:var(--yellow);font-size:11px;margin-top:2px}
    .mini-actions{display:flex;gap:6px}
    .mini{border:1px solid #4b4b44;background:#282824;color:#f1f0e8;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:11px}
    .section{margin-top:13px}
    .section-title{color:#aaa99f;font-size:11px;text-transform:uppercase;letter-spacing:0;margin-bottom:5px}
    .copybox{white-space:pre-wrap;background:#10100e;border:1px solid #30302c;border-radius:6px;padding:11px;color:#f0efe8;max-height:220px;overflow:auto}

    .history-row:hover{color:#fff;border-top-color:var(--mint)}

    .toast{position:fixed;right:20px;bottom:20px;background:#ecfdf5;color:#092c1d;border:1px solid #65e6a6;padding:10px 14px;border-radius:6px;box-shadow:0 10px 30px #0008;display:none;font-weight:700}

<body>
<main class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">SEARCH FLOW STUDIO · LOCAL FIRST</div>
      <h1 class="title">TikTok 爆款关键词搜索流</h1>
      <p class="sub">把一个热点拆成多个账号可直接发布的差异化关键词包：搜索词、钩子、去重清单、配音和置顶评论一次生成。</p>
    </div>
    <div class="badge">账号数据只保存在本机</div>
  </header>
  <div class="grid">
    <aside class="panel">
      <h2>生成配置</h2>
      <div class="field"><label>热点 / 主题</label><input id="topic" placeholder="例如：Chrome Flow Photo Effect" /></div>
      <div class="field"><label>人物 / IP（可选）</label><input id="ip" placeholder="例如：Batman、Ava、Lamborghini" /></div>
      <div class="field"><label>参考关键词（全部粘贴即可）</label><textarea id="refs" placeholder="可一次粘贴全部关键词，用逗号、分号或换行分隔"></textarea></div>
      <div class="field"><label>账号（点击选择）</label>
        <div id="accounts" class="account-list empty">请先新增账号</div>
        <div class="account-admin">
          <div class="account-form">
            <input id="newAccountId" maxlength="12" placeholder="账号 ID，如 A1" />
            <input id="newAccountName" placeholder="显示名称" />
            <select id="newAccountTool"><option>CapCut</option><option>Kling AI</option></select>
            <input id="newAccountTime" class="wide" placeholder="发布时间，如北京时间 07:30" />
          </div>
          <div class="actions"><button class="btn small" id="addAccount">＋ 新增账号</button><button class="btn secondary small" id="clearAccounts">清空账号</button></div>
          <div class="bulk-form"><textarea id="bulkAccounts" placeholder="批量新增：每行一个，格式为 ID | 显示名称 | 工具 | 发布时间"></textarea><button class="btn secondary small" id="addBulkAccounts">批量新增账号</button></div>
          <p class="account-note">账号只保存在当前浏览器，不上传服务器。每位同事维护自己的列表。</p>
        </div>
      </div>
      <div class="field"><label>生成设置</label>
        <div class="checks">
          <label><input id="multi" type="checkbox" checked /> 多语言变体</label>
          <label><input id="mustTool" type="checkbox" checked /> 工具词</label>
          <label><input id="hashtags" type="checkbox" checked /> 话题标签</label>
        </div>
      </div>
      <div class="field"><label>话题标签数量</label><input id="tagCount" type="number" min="1" max="12" value="5" /><p class="account-note">默认 5 个，可调整到 12 个，每个账号的标签组合都不一样。</p></div>
      <div class="actions"><button class="btn pink" id="generate">生成搜索流</button><button class="btn secondary" id="all">全选账号</button><button class="btn secondary" id="clear">清空结果</button></div>
      <div class="history"><h2>最近生成</h2><div id="historyList" class="empty">暂无记录</div></div>
    </aside>
    <section class="results-panel">
      <div class="result-head"><div><h2>发布包</h2><span id="count">等待生成</span></div><button class="btn secondary" id="copyAll">复制全部</button></div>
      <div id="verify" class="verify"></div>
      <div id="results" class="empty">输入热点并点击“生成搜索流”</div>
    </section>
  </div>
</main>

const HISTORY_LIMIT=10;
// Unique lead-in per account: index 0 of every output's keyword list, so the
// first four search words never collide between accounts.
const LEADS=[
 'how to make','how to do','how to create','how to edit','how to remake','how to get',
 'tutorial for','guide for','easy tutorial for','quick guide to','beginner guide to','full tutorial on',
 'easy method for','fast way to','simple steps for','step by step guide to','complete guide to','crash course on',
 'viral','trending','new','best','clean','aesthetic',
 'copy this','try this','learn this','master this','remake this','save this',
 'kling ai method for','capcut method for','ai edit for','photo edit for','template for','filter for',
 'effect tutorial for','trend tutorial for','original edit for','viral edit for','cinematic edit for','smooth edit for',
 'zero skill','no experience','one tap','phone only','free template for','hidden method for'
];
let ACCOUNTS=loadAccounts(),selected=new Set(ACCOUNTS.map(a=>a[0])),last=[];
const $=id=>document.getElementById(id);
function loadAccounts(){
  try{
    const stored=localStorage.getItem('sf-accounts');
    if(stored===null)return DEFAULT_ACCOUNTS.map(a=>[...a]);
    const value=JSON.parse(stored);
    if(Array.isArray(value)&&value.every(a=>Array.isArray(a)&&a.length===4)){
      if(!value.length&&localStorage.getItem('sf-accounts-cleared')!=='1')return DEFAULT_ACCOUNTS.map(a=>[...a]);
      return value;
    }
  }catch(e){}
  return [];
}
function persistAccounts(){
  localStorage.setItem('sf-accounts',JSON.stringify(ACCOUNTS));
  if(ACCOUNTS.length)localStorage.removeItem('sf-accounts-cleared');
  else localStorage.setItem('sf-accounts-cleared','1');
}
function show(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function renderAccounts(){
  $('accounts').className=ACCOUNTS.length?'account-list':'account-list empty';
  $('accounts').innerHTML=ACCOUNTS.length?ACCOUNTS.map(a=>`<div class="account-row"><button class="account ${selected.has(a[0])?'active':''}" data-id="${esc(a[0])}">${esc(a[1])}<small>${esc(a[2])} · ${esc(a[3])}</small></button><button class="icon-btn" data-remove="${esc(a[0])}" title="删除 ${esc(a[1])}" aria-label="删除 ${esc(a[1])}">×</button></div>`).join(''):'请先新增账号';
  document.querySelectorAll('.account').forEach(b=>b.onclick=()=>{let id=b.dataset.id;selected.has(id)?selected.delete(id):selected.add(id);b.classList.toggle('active')});
  document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeAccount(b.dataset.remove));
}
function addAccount(){
  const id=$('newAccountId').value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,''),name=$('newAccountName').value.trim(),tool=$('newAccountTool').value,time=$('newAccountTime').value.trim()||'按账号后台活跃时段';
  if(!id||!name){show('请输入账号 ID 和名称');return}
  if(ACCOUNTS.some(a=>a[0]===id)){show('账号 ID 已存在');return}
  ACCOUNTS.push([id,name,tool,time]);selected.add(id);persistAccounts();renderAccounts();
  $('newAccountId').value='';$('newAccountName').value='';$('newAccountTime').value='';show('账号已新增');
}
function addBulkAccounts(){
  const rows=$('bulkAccounts').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(!rows.length){show('请先粘贴批量账号');return}
  let added=0;
  rows.forEach(row=>{
    const p=row.split(/\s*[|｜]\s*|\s*[,，]\s*/).map(x=>x.trim());
    if(p.length<2)return;
    const id=p[0].toUpperCase().replace(/[^A-Z0-9_-]/g,''),name=p[1],tool=/kling/i.test(p[2]||'')?'Kling AI':'CapCut',time=p[3]||'按账号后台活跃时段';
    if(!id||!name||ACCOUNTS.some(a=>a[0]===id))return;
    ACCOUNTS.push([id,name,tool,time]);selected.add(id);added++;
  });
  if(added){persistAccounts();renderAccounts();$('bulkAccounts').value='';show('已批量新增 '+added+' 个账号')}
  else show('没有可新增的账号，请检查格式或重复 ID');
}
function removeAccount(id){
  const account=ACCOUNTS.find(a=>a[0]===id);
  if(!account||!confirm('确定删除账号“'+account[1]+'”吗？'))return;
  ACCOUNTS=ACCOUNTS.filter(a=>a[0]!==id);selected.delete(id);persistAccounts();renderAccounts();show('账号已删除');
}
function clearAccounts(){
  if(!ACCOUNTS.length){show('当前没有账号');return}
  if(!confirm('确定清空当前浏览器里的全部账号吗？'))return;
  ACCOUNTS=[];selected.clear();persistAccounts();renderAccounts();show('账号已清空');
}
function clean(s){return s.trim().replace(/^[-•\d️⃣.\s]+/,'')}
function rotate(list,shift){if(!list.length)return list;const n=((shift%list.length)+list.length)%list.length;return list.slice(n).concat(list.slice(0,n))}
function seededShuffle(list,seed){
  const a=[...list];
  let s=((seed+1)*2654435761)%4294967296;
  for(let i=a.length-1;i>0;i--){
    s=(s*1664525+1013904223)%4294967296;
    const j=s%(i+1);
    const tmp=a[i];a[i]=a[j];a[j]=tmp;
  }
  return a;
}
function topicVariants(topic){
  const lower=topic.toLowerCase().trim();
  const compact=lower.replace(/[^a-z0-9]+/g,'');
  const dashed=lower.replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const words=lower.split(/\s+/).filter(Boolean);
  return [...new Set([lower,compact,dashed,words.reverse().join(' ')])].filter(Boolean);
}
function ipVariants(ip){
  if(!ip)return [];
  const lower=ip.toLowerCase().trim();
  const compact=lower.replace(/[^a-z0-9]+/g,'');
  const words=lower.split(/\s+/).filter(Boolean);
  return [...new Set([lower,compact,words.reverse().join(' ')])].filter(Boolean);
}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,24)||'trend'}
function emojiOf(combo){return (combo.split(' ')[0]||'✨')}

// Pure generator: the same input always produces the same pack, and each account
// gets its own hook, sticker set, keyword order, hashtag mix, voice and caption.
function generatePack(cfg){
  const topic=(cfg.topic||'viral edit').trim();
  const ip=(cfg.ip||'').trim();
  const topicLower=topic.toLowerCase();
  const topicForms=topicVariants(topic);
  const ipForms=ipVariants(ip);
  const topicSlug=slug(topic);
  const accounts=cfg.accounts||[];
  const out=[];
  accounts.forEach((a,idx)=>{
    const id=a[0],tool=a[2]||'CapCut',kling=/kling/i.test(tool),toolShort=kling?'kling ai':'capcut';
    const toolForms=kling
      ?['kling ai template','kling ai tutorial','kling creators','kling ai edit','kling ai effect','kling ai filter','kling ai trend']
      :['capcut template','capcut tutorial','capcut pioneer','capcut edit','capcut effect','capcut filter','capcut trend'];
    const seed=idx*97+13;
    let hookText=HOOKS[idx%HOOKS.length]
      .replaceAll('{topic}',topic)
      .replaceAll('{tool}',tool)
      .replaceAll('{ip}',ip||'this edit');
    const round=Math.floor(idx/HOOKS.length);
    if(round>0)hookText=hookText.replace(/[.?!]$/,'')+', part '+(round+1)+'.';
    const ded=DEDUP[idx%DEDUP.length];
    const angle=ANGLES[(idx*7)%ANGLES.length];
    let terms=[...cfg.refs];
    topicForms.forEach(v=>{
      terms.push(
        `how to ${v}`,`how to make ${v}`,`how to do ${v}`,`${v} tutorial`,`${v} ${toolShort} tutorial`,
        `${v} trend`,`${v} original`,`${v} template`,`${v} edit`,`${v} filter`,`${v} effect`,
        `${v} challenge`,`${v} ai edit`,`${v} step by step`,`${v} for beginners`
      );
    });
    if(ipForms.length)ipForms.forEach(person=>topicForms.slice(0,3).forEach(v=>terms.push(`${person} ${v}`,`${v} ${person}`,`${person} ${v} edit`,`${person} ${v} tutorial`)));
    if(cfg.multi){
      LANG.forEach(x=>terms.push(x.replaceAll('{topic}',topicLower)));
      rotate(LANG,(idx*3)%LANG.length).slice(0,7).forEach(x=>terms.push(x.replaceAll('{topic}',topicForms[(idx+1)%topicForms.length])));
    }
    if(cfg.mustTool){
      toolForms.forEach(x=>terms.push(`${topicLower} ${x}`,x,`${x} for ${topicLower}`));
      terms.push(`${topicLower} ${angle}`,`${angle} ${topicLower}`,`how to ${angle}`,`${toolShort} ${angle}`);
    }
    terms=[...new Set(terms.map(x=>x.toLowerCase().replace(/\s+/g,' ').trim()).filter(Boolean))];
    terms=rotate(seededShuffle(terms,seed),idx*5);
    const lead=(LEADS[idx%LEADS.length]+' '+topicLower).replace(/\s+/g,' ').trim();
    terms=[lead,...terms.filter(t=>t!==lead)];
    const coreTags=kling?['#klingai','#klingcreators']:['#capcut','#capcuttemplate'];
    const poolTags=kling
      ?['#kling','#klingtutorial','#klingtemplate','#klingaiedit','#aivideo','#aiphoto','#photoedit','#aiedit','#viralaiedit','#klingfilter']
      :['#capcutpioneer','#capcuttutorial','#capcutedit','#capcuteffect','#capcutfilter','#capcutphoto','#videoedit','#editing','#photoedit','#edittutorial'];
    let tagList=[];
    if(cfg.hash){
      const extra=[...new Set([...poolTags,'#'+topicSlug,ip?('#'+slug(ip)):'','#'+topicSlug+'trend','#viraledit','#fyp','#foryou','#viral','#trending','#tutorial','#'+slug(angle)].filter(Boolean))];
      const target=Math.max(1,cfg.tagCount||5);
      tagList=[...coreTags.slice(0,Math.min(target,coreTags.length)),...seededShuffle(extra,seed+41)].slice(0,target);
    }
    const voice=VOICES[idx%VOICES.length].replaceAll('{topic}',topic).replaceAll('{tool}',tool);
    const comment=COMMENTS[idx%COMMENTS.length].replaceAll('{tool}',tool).replaceAll('{topic}',topic).replaceAll('{emoji}',emojiOf(ded[0]));
    out.push({
      id,
      name:a[1],
      tool,
      schedule:a[3],
      hook:hookText,
      keywords:terms.join(' '),
      tags:tagList.join(' '),
      dedup:ded.join(' / ')+(kling?' / Kling 英式版配音':' / CapCut 美式版配音'),
      voice,
      comment
    });
  });
  return out;
}
function build(){
  if(!selected.size){show('至少选择一个账号');return []}
  let tagCount=parseInt($('tagCount').value,10);
  if(!Number.isFinite(tagCount))tagCount=5;
  tagCount=Math.max(1,Math.min(12,tagCount));
  const cfg={
    topic:$('topic').value.trim(),
    ip:$('ip').value.trim(),
    refs:$('refs').value.split(/[\n,，;；、|]+/).map(clean).filter(Boolean),
    multi:$('multi').checked,
    mustTool:$('mustTool').checked,
    hash:$('hashtags').checked,
    tagCount,
    accounts:ACCOUNTS.filter(a=>selected.has(a[0]))
  };
  return generatePack(cfg);
}
function uniqueness(out){
  const uniq=key=>new Set(out.map(key)).size;
  return {
    total:out.length,
    hook:uniq(x=>x.hook),
    tags:uniq(x=>x.tags),
    opening:uniq(x=>x.keywords.split(' ').slice(0,4).join(' ')),
    dedup:uniq(x=>x.dedup),
    voice:uniq(x=>x.voice),
    comment:uniq(x=>x.comment)
  };
}
function render(out,save=true){
  last=out;
  if(!out.length){$('results').className='empty';$('results').textContent='暂无结果';$('count').textContent='等待生成';$('verify').textContent='';return}
  const u=uniqueness(out);
  $('count').textContent=u.total+' 个账号 · 搜索词/钩子/去重已生成';
  const perfect=u.hook===u.total&&u.tags===u.total&&u.opening===u.total&&u.dedup===u.total&&u.voice===u.total;
  $('verify').className='verify'+(perfect?'':' low');
  $('verify').innerHTML='去重校验：钩子 <b>'+u.hook+'/'+u.total+'</b> · 话题标签 <b>'+u.tags+'/'+u.total+'</b> · 开头词序 <b>'+u.opening+'/'+u.total+'</b> · 贴纸特效 <b>'+u.dedup+'/'+u.total+'</b> · 配音 <b>'+u.voice+'/'+u.total+'</b> · 评论 <b>'+u.comment+'/'+u.total+'</b>';
  $('results').className='cards';
  $('results').innerHTML=out.map((x,i)=>`<article class="card"><div class="card-top"><div><div class="account-name">${esc(x.name)} <span class="pill good">${esc(x.id)}</span></div><div class="tool">${esc(x.tool)} · ${esc(x.schedule)}</div></div><div class="mini-actions"><button class="mini" data-copy="${i}">复制本条</button></div></div><div class="section"><div class="section-title">钩子 + 搜索流</div><div class="copybox">${esc(x.hook)} ${esc(x.keywords)} ${esc(x.tags)}</div></div><div class="section"><div class="section-title">去重清单</div><div class="copybox">${esc(x.dedup)}</div></div><div class="section"><div class="section-title">配音文案</div><div class="copybox">${esc(x.voice)}</div></div><div class="section"><div class="section-title">置顶评论</div><div class="copybox">${esc(x.comment)}</div></div></article>`).join('');
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyOne(last[+b.dataset.copy]));
  if(save)saveHistory();
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function textOf(x){return `${x.name}（${x.id}｜${x.tool}）\n\n${x.hook} ${x.keywords} ${x.tags}\n\n去重：${x.dedup}\n配音：${x.voice}\n置顶评论：${x.comment}\n发布时间：${x.schedule}`}
async function copyOne(x){await navigator.clipboard.writeText(textOf(x));show('已复制 '+x.name+' 发布包')}
async function copyAll(){if(!last.length){show('请先生成');return}await navigator.clipboard.writeText(last.map(textOf).join('\n\n──────────\n\n'));show('已复制全部发布包')}
function saveHistory(){
  let h=JSON.parse(localStorage.getItem('sf-history')||'[]');
  h.unshift({topic:$('topic').value,at:new Date().toLocaleString(),count:last.length,outputs:last});
  localStorage.setItem('sf-history',JSON.stringify(h.slice(0,HISTORY_LIMIT)));
  renderHistory();
}
function renderHistory(){
  let h=JSON.parse(localStorage.getItem('sf-history')||'[]');
  $('historyList').className=h.length?'':'empty';
  $('historyList').innerHTML=h.length?h.map((x,i)=>`<button class="history-row" data-history="${i}"><span>${esc(x.topic||'未命名')} · ${x.count||0} 个账号</span><span class="history-meta">${x.outputs&&x.outputs.length?'查看内容':'仅主题记录'} · ${esc(x.at)}</span></button>`).join(''):'暂无记录';
  document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>openHistory(+b.dataset.history));
}
function openHistory(index){
  const h=JSON.parse(localStorage.getItem('sf-history')||'[]'),entry=h[index];
  if(!entry||!entry.outputs||!entry.outputs.length){show('这条是旧记录，没有保存生成内容');return}
  if(entry.topic)$('topic').value=entry.topic;
  render(entry.outputs,false);show('已打开历史发布包');
}
$('generate').onclick=()=>render(build());
$('copyAll').onclick=copyAll;
$('all').onclick=()=>{selected=new Set(ACCOUNTS.map(a=>a[0]));renderAccounts()};
$('addAccount').onclick=addAccount;
$('addBulkAccounts').onclick=addBulkAccounts;
$('clearAccounts').onclick=clearAccounts;
$('clear').onclick=()=>{last=[];$('results').className='empty';$('results').textContent='输入热点并点击“生成搜索流”';$('count').textContent='等待生成';$('verify').textContent='';$('verify').className='verify'};
renderAccounts();
renderHistory();
